<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mrs. Baker’s Bell Work Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="teacher.css"></head><body>
<header><a href="index.html">← Classroom site</a><div><b>Mrs. Baker’s</b><small>Bell Work Dashboard</small></div><button id="teacher-signout" hidden>Sign out</button></header>
<main><section class="teacher-hero"><p>Grade 6 ELA · Private teacher view</p><h1>Bell work at a glance.</h1><div id="auth-box"><p>Sign in with Mrs. Baker’s approved teacher Google account.</p><button id="teacher-signin">Teacher sign in</button><button id="demo-dashboard" type="button">Preview with sample submissions</button></div><p id="teacher-status" role="status"></p></section>
<section id="dashboard-content" hidden><div class="controls"><label>Date<input type="date" id="date-filter"></label><label>Class<select id="class-filter"><option value="">All classes</option></select></label><label>Standard<select id="standard-filter"><option value="">All standards</option></select></label><button id="refresh-data">Refresh</button><button id="export-data">Export CSV</button></div>
<div class="teacher-metrics"><article><span>Submitted</span><strong id="submission-total">0</strong></article><article><span>Students</span><strong id="student-total">0</strong></article><article><span>Average words</span><strong id="word-average">0</strong></article><article><span>Need help</span><strong id="help-total">0</strong><small>Confidence 1–2</small></article></div>
<div class="response-layout"><aside><h2>Submissions</h2><div id="submission-list"></div></aside><article id="response-detail"><p>Select a student response to review it.</p></article></div></section></main>
<script src="firebase-config.js"></script><script type="module" src="teacher.js"></script></body></html>
